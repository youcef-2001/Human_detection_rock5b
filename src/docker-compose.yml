services:

  postgres:
    image: postgres:16-alpine
    container_name: human-detection-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-human_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-human_pass}
      POSTGRES_DB: ${POSTGRES_DB:-human_detection}
    ports:
      - "5432:5432"
    volumes:
      - ./db/data/postgresql:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-human_user} -d ${POSTGRES_DB:-human_detection}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
