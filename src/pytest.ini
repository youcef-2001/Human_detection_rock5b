[pytest]
# Pytest configuration for Human Detection API tests

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage options
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# Markers
markers =
    integration: Integration tests
    unit: Unit tests
    slow: Slow tests
    skipif: Conditional skipping

# Minimum Python version
minversion = 3.8

# Timeout for tests (seconds)
timeout = 300

# Log configuration
log_cli = false
log_cli_level = INFO
log_file = tests.log
log_file_level = DEBUG
